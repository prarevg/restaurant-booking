          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_get_api_restaurants_id_tables_tableID
    delete:
      tags:
      - tables
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: tableID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
