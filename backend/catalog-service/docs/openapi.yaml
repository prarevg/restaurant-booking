      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: reviewID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - Review
                properties:
                  Review:
                    $ref: '#/components/schemas/Review'
                additionalProperties: false
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
