          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - Item
                properties:
                  Item:
                    $ref: '#/components/schemas/ReviewDetail'
                additionalProperties: false
        '404':
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
