          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
