          description: Not found
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Изменять и удалять отзыв может только автор
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
