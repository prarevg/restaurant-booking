                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_get_api_restaurants_id_tables
    post:
      tags:
      - tables
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
