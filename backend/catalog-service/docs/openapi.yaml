  /service/restaurants/{restaurantID}/tables/{tableID}:
    get:
      tags:
      - service
      parameters:
      - in: path
        name: restaurantID
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: tableID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - restaurant_id
                - table_number
                - seats_count
                properties:
                  id:
                    type: string
                    format: uuid
                  restaurant_id:
                    type: string
                    format: uuid
                  table_number:
                    type: integer
                  seats_count:
                    type: integer
        '404':
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_get_service_restaurants_restaurantID_tables_tableID
  /ready:
    get:
      summary: Готовность сервиса и доступность PostgreSQL
      tags:
      - health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ready
                additionalProperties: false
        '503':
          description: database unavailable
          content:
            text/plain:
              schema:
                type: string
      description: Проверяет соединение с БД. Доступность RabbitMQ и активность потребителя не проверяются. Публичный
        nginx этот путь не обслуживает.
      operationId: catalog_get_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Restaurant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        city:
          type: string
        address:
          type: string
        photos:
          type: array
          items:
            type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        price_category:
          type: string
          enum:
          - low
          - medium
          - high
        cuisine_type:
          type: string
          enum: &id001
          - italian
          - japanese
          - georgian
          - russian
          - american
          - mexican
          - chinese
          - thai
          - indian
          - european
          - mediterranean
          - other
      required:
      - id
      - name
      - description
      - city
      - address
      - photos
      - created_at
      - price_category
      - cuisine_type
    RestaurantCreateRequest:
      type: object
      required:
      - name
      - description
      - city
      - address
      - cuisine_type
      - price_category
      properties:
        name:
          type: string
        description:
          type: string
        city:
          type: string
        address:
          type: string
        cuisine_type:
          type: string
          enum: *id001
        price_category:
          type: string
          enum:
          - low
          - medium
          - high
        photos:
          type: array
          items:
            type: string
    MenuItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_available:
          type: boolean
        proteins:
          type: number
        fats:
          type: number
        carbs:
          type: number
        price:
          type: number
        category:
          type: string
      required:
      - id
      - restaurant_id
      - name
      - description
      - is_available
      - proteins
      - fats
      - carbs
      - price
      - category
    MenuCreateRequest:
      type: object
      required:
      - name
      - description
      - price
      - category
      properties:
        name:
          type: string
