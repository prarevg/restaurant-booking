openapi: 3.0.3
info:
  title: Catalog Service API
  version: 1.0.0
  description: Рестораны, столики, меню и отзывы. Все /api требуют JWT. /service и /ready доступны внутри стенда.
servers:
- url: /
tags:
- name: restaurants
- name: menu
- name: tables
- name: reviews
- name: service
paths:
  /api/restaurants/:
    get:
      tags:
      - restaurants
      summary: Список ресторанов
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: cuisine_type
        schema:
          type: string
      - in: query
        name: price_category
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - restaurants
                properties:
                  restaurants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
                additionalProperties: false
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_get_api_restaurants
    post:
      tags:
      - restaurants
      summary: Создать ресторан
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantCreateRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - restaurant
                properties:
                  restaurant:
                    $ref: '#/components/schemas/Restaurant'
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_post_api_restaurants
  /api/restaurants/{id}/:
    get:
      tags:
      - restaurants
      summary: Получить ресторан
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - restaurant
                properties:
                  restaurant:
                    $ref: '#/components/schemas/Restaurant'
                additionalProperties: false
        '404':
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_get_api_restaurants_id
    delete:
      tags:
      - restaurants
      summary: Удалить ресторан
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - restaurant
                properties:
                  restaurant:
                    $ref: '#/components/schemas/DeletedRestaurant'
                additionalProperties: false
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_delete_api_restaurants_id
  /api/restaurants/{id}/menu:
    get:
      tags:
      - menu
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: proteins_min
        schema:
          type: number
      - in: query
        name: proteins_max
        schema:
          type: number
      - in: query
        name: fats_min
        schema:
          type: number
      - in: query
        name: fats_max
        schema:
          type: number
      - in: query
        name: carbs_min
        schema:
          type: number
      - in: query
        name: carbs_max
        schema:
          type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - Items
                properties:
                  Items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
                additionalProperties: false
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_get_api_restaurants_id_menu
    post:
      tags:
      - menu
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCreateRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - item
                properties:
                  item:
                    $ref: '#/components/schemas/MenuItem'
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Restaurant not found
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_post_api_restaurants_id_menu
  /api/restaurants/{id}/menu/{itemID}:
    get:
      tags:
      - menu
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: itemID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - item
                properties:
                  item:
                    $ref: '#/components/schemas/MenuItem'
                additionalProperties: false
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_get_api_restaurants_id_menu_itemID
    delete:
      tags:
      - menu
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: itemID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_delete_api_restaurants_id_menu_itemID
  /api/restaurants/{id}/tables:
    get:
      tags:
      - tables
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
