  /api/restaurants/{id}/reviews:
    get:
      tags:
      - reviews
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - Items
                properties:
                  Items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReviewItem'
                additionalProperties: false
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_get_api_restaurants_id_reviews
    post:
      tags:
      - reviews
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewBody'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - Review
                properties:
                  Review:
                    $ref: '#/components/schemas/Review'
                additionalProperties: false
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Ресторан не найден или пользователь еще не попал в кеш Catalog
          content:
            text/plain:
              schema:
                type: string
        '409':
          description: Отзыв пользователя уже существует
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Некорректные входные данные
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
