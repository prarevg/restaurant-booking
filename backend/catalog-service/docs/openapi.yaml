        '400':
          description: Invalid input
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Требуется действующий Bearer JWT
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Restaurant not found
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка
          content:
            text/plain:
              schema:
                type: string
      operationId: catalog_post_api_restaurants_id_tables
  /api/restaurants/{id}/tables/{tableID}:
    get:
      tags:
