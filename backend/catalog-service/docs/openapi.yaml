  /api/restaurants/{id}/reviews/{reviewID}:
    get:
      tags:
      - reviews
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: reviewID
        required: true
        schema:
          type: string
          format: uuid
      responses:
